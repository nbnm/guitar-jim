name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Report Swift toolchain
        run: swift --version
      - name: Run tests
        run: ./Scripts/test.sh
      - name: Build app bundle
        run: ./Scripts/build-app.sh
      - name: Verify bundle signature
        run: codesign --verify --deep --strict "build/Guitar Jim.app"
